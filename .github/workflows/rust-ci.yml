name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Output rust version for educational purposes
        run: rustup --version

      - uses: actions/checkout@v7

      # https://taskfile.dev/docs/installation
      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Build
        run: cargo build

      - name: Run tests
        run: task tests

      - name: Check doc
        run: task doc

      - name: Check clippy
        run: task lints

      - name: Check style
        run: task fmtchk
